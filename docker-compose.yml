services:
  xbox-speedup:
    image: ${XBOX_IMAGE:-ghcr.io/rosemengzi/xbox-speedup:latest}
    pull_policy: always
    container_name: xbox-speedup
    restart: unless-stopped
    environment:
      XBOX_WEB_TOKEN: ${XBOX_WEB_TOKEN:-}
      XBOX_HEALTH_URL: ${XBOX_HEALTH_URL:-http://127.0.0.1:8080/healthz}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - NET_RAW
    networks:
      xbox_macvlan:
        ipv4_address: ${XBOX_IP:-192.168.1.250}
    volumes:
      - ${XBOX_DATA_DIR:-./run-data}:/data
      - ${XBOX_CERT_DIR:-./certs}:/certs:ro
networks:
  xbox_macvlan:
    external: true
    name: ${XBOX_NETWORK:-xbox_macvlan}
